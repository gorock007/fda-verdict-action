# Namlo verdict, the reusable workflow (decision 0027). Customer
# repositories call it at this commit (`W`) from a default-branch
# pull_request_target workflow. It takes no inputs and no secrets: every
# fact comes from the event, GitHub's API and this run's own artifacts.
#
#   prepare  contents: read, pull-requests: read. Git objects only: verify
#            the signed envelope, gate B..P, export P. Runs no customer code.
#   execute  no permissions. Setup and the signed specs run in a locked-down
#            container under a host supervisor; only the supervisor writes
#            the result.
#   report   id-token: write only. Sends the bounded report to Namlo, which
#            publishes the App-owned FDA / verdict check.
name: Namlo verdict
on:
  workflow_call: {}
permissions: {}
jobs:
  prepare:
    name: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    outputs:
      outcome: ${{ steps.prepare.outputs.outcome }}
      digest: ${{ steps.prepare.outputs.digest }}
      source-digest: ${{ steps.prepare.outputs.source-digest }}
      prepare-artifact-id: ${{ steps.upload-prepare.outputs.artifact-id }}
      source-artifact-id: ${{ steps.upload-source.outputs.artifact-id }}
    steps:
      - id: prepare
        uses: gorock007/fda-verdict-action@734c5db8fbc7b22e0e74fcad84b310efbe655d1f
        with:
          mode: prepare
          token: ${{ github.token }}
          app-slug: "fda-agents"
      - id: upload-prepare
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fda-verdict-prepare-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fda-verdict/out/prepare/prepare.json
          if-no-files-found: error
          retention-days: 7
      - id: upload-source
        if: steps.prepare.outputs.outcome == 'passed'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fda-verdict-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fda-verdict/out/source/source.tar
          if-no-files-found: error
          retention-days: 1

  execute:
    name: execute
    needs: prepare
    if: needs.prepare.outputs.outcome == 'passed'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions: {}
    outputs:
      result-artifact-id: ${{ steps.upload-result.outputs.artifact-id }}
      result-digest: ${{ steps.upload-result.outputs.artifact-digest }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.prepare.outputs.prepare-artifact-id }}
          path: ${{ runner.temp }}/fda-verdict/in/fda-verdict-prepare-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.prepare.outputs.source-artifact-id }}
          path: ${{ runner.temp }}/fda-verdict/in/fda-verdict-source-${{ github.run_id }}-${{ github.run_attempt }}
      - id: execute
        uses: gorock007/fda-verdict-action@734c5db8fbc7b22e0e74fcad84b310efbe655d1f
        with:
          mode: execute
          prepare-digest: ${{ needs.prepare.outputs.digest }}
          source-digest: ${{ needs.prepare.outputs.source-digest }}
          image: "ghcr.io/gorock007/fda-verdict-runner@sha256:7213a57f2b3af2d3b245bbd160de012dc6d06d4dff133c0f81bbd479959a6194"
          gvisor-url: "https://storage.googleapis.com/gvisor/releases/release/20261026/x86_64/gvisor.tar.bz2"
          gvisor-sha256: "096589d2d6078ba4caa26aa0200932f571aa5da9d08a5156b98ab1d93fa54468"
      - id: upload-result
        if: always() && steps.execute.outputs.result-written == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fda-verdict-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fda-verdict/out/result/result.json
          if-no-files-found: error
          retention-days: 7

  report:
    name: report
    needs: [prepare, execute]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      id-token: write
    steps:
      - if: needs.prepare.outputs.prepare-artifact-id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.prepare.outputs.prepare-artifact-id }}
          path: ${{ runner.temp }}/fda-verdict/in/fda-verdict-prepare-${{ github.run_id }}-${{ github.run_attempt }}
      - if: needs.execute.outputs.result-artifact-id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.execute.outputs.result-artifact-id }}
          path: ${{ runner.temp }}/fda-verdict/in/fda-verdict-result-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: gorock007/fda-verdict-action@734c5db8fbc7b22e0e74fcad84b310efbe655d1f
        with:
          mode: report
          prepare-digest: ${{ needs.prepare.outputs.digest }}
          result-digest: ${{ needs.execute.outputs.result-digest }}
          execute-result: ${{ needs.execute.result }}
